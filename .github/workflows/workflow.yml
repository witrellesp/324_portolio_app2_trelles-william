name: CI/CD Workflow for Passion Lecture

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./passion-lecture/passion-lecture-backend/src

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-backend-${{ hashFiles('passion-lecture/backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Install dependencies
        run: npm ci



  frontend:
      name: frontend
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: ./passion-lecture/passion-lecture-vue
  
      steps:
        - name: Checkout code
          uses: actions/checkout@v3
  
        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
            node-version: '20'
  
        - name: Cache Node.js modules
          uses: actions/cache@v3
          with:
            path: ~/.npm
            key: ${{ runner.os }}-frontend-${{ hashFiles('passion-lecture/frontend/package-lock.json') }}
            restore-keys: |
              ${{ runner.os }}-frontend-
  
        - name: Install dependencies
          run: npm ci

        - name: Lint code
          run: npm run lint

        - name: Format code
          run: npm run format


        - name: Build frontend
          run: npm run build
        
        - name: ls
          run: ls -la

        - name: Upload de l'artefact
          uses: actions/upload-artifact@v4
          with:
            name: frontend-build
            path: ./dist

